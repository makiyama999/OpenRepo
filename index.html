<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Breakout</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js for audio synth sound effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap');
        
        body {
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            background-color: #090a0f;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }

        .neon-text-blue {
            text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 20px #00f0ff;
        }

        .neon-text-pink {
            text-shadow: 0 0 5px #ff007f, 0 0 10px #ff007f, 0 0 20px #ff007f;
        }

        .neon-box {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.2);
            border: 1px solid rgba(0, 240, 255, 0.5);
        }

        canvas {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            background: radial-gradient(circle at center, #121526 0%, #080910 100%);
        }

        /* Custom Scrollbar for High Scores */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between items-center p-2 sm:p-4 select-none">

    <!-- Top Header / Scoreboard -->
    <header class="w-full max-w-4xl flex justify-between items-center px-4 py-2 bg-slate-900/80 backdrop-blur border border-slate-800 rounded-xl mb-2">
        <div class="flex items-center gap-2">
            <i data-lucide="zap" class="text-cyan-400 animate-pulse"></i>
            <h1 class="text-xl sm:text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">
                NEON BREAKOUT
            </h1>
        </div>

        <div class="flex items-center gap-4 sm:gap-8 text-sm sm:text-base font-bold">
            <div class="flex items-center gap-2">
                <span class="text-slate-400">SCORE</span>
                <span id="score-display" class="text-cyan-400 font-mono text-xl">00000</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-slate-400">STAGE</span>
                <span id="stage-display" class="text-pink-500 font-mono text-xl">1</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-slate-400">LIVES</span>
                <div id="lives-display" class="flex gap-1 text-red-500">
                    <!-- Hearts added via JS -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Interactive Area -->
    <main class="relative w-full max-w-4xl flex-1 flex justify-center items-center my-auto min-h-0">
        <canvas id="gameCanvas" class="w-full h-full max-h-[75vh] object-contain"></canvas>

        <!-- Overlay for Start / Pause / Game Over -->
        <div id="overlay" class="absolute inset-0 bg-black/80 backdrop-blur-md rounded-xl flex flex-col items-center justify-center p-6 text-center z-20">
            <!-- Start Screen -->
            <div id="screen-start" class="space-y-6 max-w-md">
                <h2 class="text-4xl sm:text-5xl font-black text-cyan-400 tracking-wider neon-text-blue">
                    サイバー・ブロック崩し
                </h2>
                <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
                    ネオンの世界でブロックを打ち砕け！アイテムを獲得して強力なアビリティを発動しよう。
                </p>
                
                <div class="bg-slate-900/60 p-4 rounded-lg border border-slate-700 text-xs text-left text-slate-300 space-y-2">
                    <p class="font-bold text-cyan-400 mb-1">🎮 操作方法:</p>
                    <p>• マウス / タッチ: パドルの移動</p>
                    <p>• [SPACE] または タップ: ボール発射 / レーザー攻撃</p>
                    <p>• [P]: 一時停止</p>
                </div>

                <button id="btn-start" class="w-full py-3 sm:py-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black font-black text-lg tracking-widest rounded-lg shadow-lg shadow-cyan-500/50 transition-all hover:scale-105 active:scale-95">
                    START GAME
                </button>
            </div>

            <!-- Game Over Screen -->
            <div id="screen-gameover" class="hidden space-y-6 max-w-md">
                <h2 class="text-4xl sm:text-5xl font-black text-pink-500 tracking-wider neon-text-pink">
                    GAME OVER
                </h2>
                <div class="space-y-1">
                    <p class="text-slate-400 text-sm">FINAL SCORE</p>
                    <p id="final-score" class="text-4xl font-mono font-bold text-cyan-400">00000</p>
                </div>

                <div id="high-score-msg" class="hidden text-amber-400 font-bold animate-bounce text-sm">
                    🏆 ハイスコア更新！
                </div>

                <button id="btn-restart" class="w-full py-3 sm:py-4 bg-gradient-to-r from-pink-500 to-rose-600 hover:from-pink-400 hover:to-rose-500 text-white font-black text-lg tracking-widest rounded-lg shadow-lg shadow-pink-500/50 transition-all hover:scale-105 active:scale-95">
                    TRY AGAIN
                </button>
            </div>

            <!-- Stage Clear Screen -->
            <div id="screen-cleared" class="hidden space-y-6 max-w-md">
                <h2 class="text-4xl sm:text-5xl font-black text-cyan-400 tracking-wider neon-text-blue">
                    STAGE CLEAR!
                </h2>
                <p class="text-slate-300">素晴らしいテクニックです！次のステージへ進みます。</p>
                <button id="btn-next" class="w-full py-3 sm:py-4 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-300 hover:to-teal-400 text-black font-black text-lg tracking-widest rounded-lg shadow-lg shadow-emerald-500/50 transition-all hover:scale-105 active:scale-95">
                    NEXT STAGE
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Bar Controls -->
    <footer class="w-full max-w-4xl flex justify-between items-center px-4 py-2 mt-2">
        <button id="btn-sound" class="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:text-cyan-400 transition-colors flex items-center gap-2 text-xs sm:text-sm">
            <i data-lucide="volume-2" id="sound-icon"></i>
            <span id="sound-text">SOUND ON</span>
        </button>

        <div class="flex gap-2">
            <button id="btn-pause" class="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 hover:text-cyan-400 transition-colors flex items-center gap-2 text-xs sm:text-sm">
                <i data-lucide="pause"></i>
                <span>PAUSE</span>
            </button>
        </div>
    </footer>

    <script>
        // Audio Synthesizer via Tone.js
        let soundEnabled = true;
        let audioInitialized = false;

        // Tone Synths
        let synth, polySynth, metalSynth;

        function initAudio() {
            if (audioInitialized) return;
            try {
                Tone.start();
                synth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
                }).toDestination();

                polySynth = new Tone.PolySynth(Tone.Synth).toDestination();
                polySynth.set({
                    volume: -8,
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.2 }
                });

                metalSynth = new Tone.MetalSynth({
                    frequency: 200,
                    envelope: { attack: 0.001, decay: 0.05, release: 0.05 },
                    harmonicity: 5.1,
                    modulationIndex: 16,
                    resonance: 4000,
                    octaves: 1.5
                }).toDestination();
                metalSynth.volume.value = -12;

                audioInitialized = true;
            } catch (e) {
                console.log("Audio Init Warning:", e);
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioInitialized) return;
            try {
                const now = Tone.now();
                if (type === 'bounce') {
                    synth.triggerAttackRelease("C5", "16n", now);
                } else if (type === 'paddle') {
                    synth.triggerAttackRelease("E4", "16n", now);
                } else if (type === 'hit') {
                    metalSynth.triggerAttackRelease("16n", now);
                } else if (type === 'powerup') {
                    polySynth.triggerAttackRelease(["C5", "E5", "G5"], "16n", now);
                } else if (type === 'laser') {
                    synth.triggerAttackRelease("G6", "32n", now);
                } else if (type === 'lose') {
                    polySynth.triggerAttackRelease(["C3", "F2"], "8n", now);
                } else if (type === 'clear') {
                    polySynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "8n", now);
                }
            } catch (e) {}
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Render Canvas Internal Dimensions
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // Game State Variables
        let gameState = 'START'; // START, PLAYING, PAUSED, CLEARED, GAMEOVER
        let score = 0;
        let stage = 1;
        let lives = 3;
        let highScore = localStorage.getItem('neon_breakout_highscore') || 0;

        // Game Objects
        let paddle = {};
        let balls = [];
        let bricks = [];
        let particles = [];
        let powerups = [];
        let lasers = [];

        // Powerup Types & Colors
        const POWERUP_TYPES = {
            WIDE: { color: '#00f0ff', label: 'W', desc: 'Paddle Expand' },
            MULTIBALL: { color: '#ff007f', label: 'M', desc: 'Multi Ball' },
            LASER: { color: '#ffe600', label: 'L', desc: 'Laser Gun' },
            LIFE: { color: '#00ff66', label: '+', desc: 'Extra Life' }
        };

        // Brick Colors by Row/Type
        const BRICK_COLORS = [
            '#ff0055', // Red
            '#ff7700', // Orange
            '#ffe600', // Yellow
            '#00ff66', // Green
            '#00f0ff', // Cyan
            '#b000ff'  // Purple
        ];

        function initPaddle() {
            paddle = {
                width: 120,
                height: 16,
                x: CANVAS_WIDTH / 2 - 60,
                y: CANVAS_HEIGHT - 35,
                speed: 8,
                dx: 0,
                hasLaser: false,
                laserTimer: 0,
                color: '#00f0ff'
            };
        }

        function createBall(x, y, isStuck = false) {
            const angle = (Math.random() * Math.PI / 4) - Math.PI / 8 - Math.PI / 2;
            const speed = 7 + (stage * 0.3);
            return {
                x: x || CANVAS_WIDTH / 2,
                y: y || paddle.y - 10,
                radius: 7,
                dx: speed * Math.cos(angle),
                dy: speed * Math.sin(angle),
                speed: speed,
                isStuck: isStuck,
                color: '#ffffff'
            };
        }

        function createBricks() {
            bricks = [];
            const rows = Math.min(5 + stage, 8);
            const cols = 9;
            const padding = 10;
            const offsetTop = 60;
            const offsetLeft = 35;
            const brickWidth = (CANVAS_WIDTH - (offsetLeft * 2) - (padding * (cols - 1))) / cols;
            const brickHeight = 22;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    // Random unbreakables or tough bricks on higher stages
                    let hp = 1;
                    if (stage > 1 && Math.random() < 0.2) hp = 2;

                    bricks.push({
                        x: offsetLeft + c * (brickWidth + padding),
                        y: offsetTop + r * (brickHeight + padding),
                        w: brickWidth,
                        h: brickHeight,
                        hp: hp,
                        maxHp: hp,
                        color: BRICK_COLORS[r % BRICK_COLORS.length],
                        alive: true
                    });
                }
            }
        }

        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function spawnPowerup(x, y) {
            if (Math.random() > 0.25) return; // 25% drop rate
            const types = Object.keys(POWERUP_TYPES);
            const type = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x: x,
                y: y,
                width: 24,
                height: 24,
                dy: 2,
                type: type,
                info: POWERUP_TYPES[type]
            });
        }

        function updatePowerups() {
            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                p.y += p.dy;

                // Collision with Paddle
                if (p.x + p.width > paddle.x &&
                    p.x < paddle.x + paddle.width &&
                    p.y + p.height > paddle.y &&
                    p.y < paddle.y + paddle.height) {
                    
                    applyPowerup(p.type);
                    playSound('powerup');
                    createExplosion(p.x, p.y, p.info.color, 8);
                    powerups.splice(i, 1);
                    continue;
                }

                // Remove out of bounds
                if (p.y > CANVAS_HEIGHT) {
                    powerups.splice(i, 1);
                }
            }
        }

        function applyPowerup(type) {
            score += 50;
            updateScoreUI();

            if (type === 'WIDE') {
                paddle.width = 180;
                setTimeout(() => { paddle.width = 120; }, 8000);
            } else if (type === 'MULTIBALL') {
                const currentCount = balls.length;
                for (let i = 0; i < currentCount; i++) {
                    const b = balls[i];
                    if (!b.isStuck) {
                        balls.push(createBall(b.x, b.y));
                    }
                }
            } else if (type === 'LASER') {
                paddle.hasLaser = true;
                paddle.laserTimer = 300; // Frames duration (~5 secs)
            } else if (type === 'LIFE') {
                lives = Math.min(lives + 1, 5);
                updateLivesUI();
            }
        }

        function fireLaser() {
            if (!paddle.hasLaser) return;
            lasers.push({ x: paddle.x + 10, y: paddle.y, dy: -10 });
            lasers.push({ x: paddle.x + paddle.width - 10, y: paddle.y, dy: -10 });
            playSound('laser');
        }

        function updateLasers() {
            for (let i = lasers.length - 1; i >= 0; i--) {
                const l = lasers[i];
                l.y += l.dy;

                // Collision with Bricks
                let hit = false;
                for (let b of bricks) {
                    if (b.alive && l.x > b.x && l.x < b.x + b.w && l.y > b.y && l.y < b.y + b.h) {
                        b.hp--;
                        if (b.hp <= 0) {
                            b.alive = false;
                            score += 100;
                            spawnPowerup(b.x + b.w / 2, b.y + b.h / 2);
                        }
                        createExplosion(l.x, l.y, '#ffe600', 5);
                        hit = true;
                        updateScoreUI();
                        break;
                    }
                }

                if (hit || l.y < 0) {
                    lasers.splice(i, 1);
                }
            }
        }

        function updateBalls() {
            if (balls.length === 0 && gameState === 'PLAYING') {
                lives--;
                updateLivesUI();
                playSound('lose');

                if (lives <= 0) {
                    gameOver();
                } else {
                    balls.push(createBall(paddle.x + paddle.width / 2, paddle.y - 10, true));
                }
                return;
            }

            for (let i = balls.length - 1; i >= 0; i--) {
                const b = balls[i];

                if (b.isStuck) {
                    b.x = paddle.x + paddle.width / 2;
                    b.y = paddle.y - b.radius - 2;
                    continue;
                }

                b.x += b.dx;
                b.y += b.dy;

                // Wall Collisions
                if (b.x - b.radius < 0) {
                    b.x = b.radius;
                    b.dx *= -1;
                    playSound('bounce');
                } else if (b.x + b.radius > CANVAS_WIDTH) {
                    b.x = CANVAS_WIDTH - b.radius;
                    b.dx *= -1;
                    playSound('bounce');
                }

                if (b.y - b.radius < 0) {
                    b.y = b.radius;
                    b.dy *= -1;
                    playSound('bounce');
                }

                // Bottom Fall
                if (b.y - b.radius > CANVAS_HEIGHT) {
                    balls.splice(i, 1);
                    continue;
                }

                // Paddle Collision
                if (b.dy > 0 &&
                    b.y + b.radius >= paddle.y &&
                    b.y - b.radius <= paddle.y + paddle.height &&
                    b.x >= paddle.x &&
                    b.x <= paddle.x + paddle.width) {

                    playSound('paddle');
                    
                    // Hit angle depending on where it lands on paddle
                    const hitPoint = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                    const maxAngle = Math.PI / 3; // 60 degrees
                    const angle = hitPoint * maxAngle;

                    b.dx = b.speed * Math.sin(angle);
                    b.dy = -b.speed * Math.cos(angle);
                    b.y = paddle.y - b.radius - 1;
                }

                // Brick Collisions
                for (let br of bricks) {
                    if (!br.alive) continue;

                    if (b.x + b.radius > br.x &&
                        b.x - b.radius < br.x + br.w &&
                        b.y + b.radius > br.y &&
                        b.y - b.radius < br.y + br.h) {

                        playSound('hit');
                        br.hp--;

                        if (br.hp <= 0) {
                            br.alive = false;
                            score += 100;
                            spawnPowerup(br.x + br.w / 2, br.y + br.h / 2);
                        } else {
                            score += 30;
                        }

                        createExplosion(b.x, b.y, br.color, 10);
                        updateScoreUI();

                        // Bounce logic
                        b.dy *= -1;

                        // Check Stage Clear
                        if (bricks.every(brick => !brick.alive)) {
                            stageClear();
                        }
                        break;
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Draw Bricks
            bricks.forEach(b => {
                if (!b.alive) return;

                ctx.save();
                ctx.fillStyle = b.hp > 1 ? '#ffffff' : b.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = b.color;
                
                // Rounded Bricks
                ctx.beginPath();
                ctx.roundRect(b.x, b.y, b.w, b.h, 4);
                ctx.fill();

                if (b.hp > 1) {
                    ctx.strokeStyle = b.color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Draw Paddle
            ctx.save();
            ctx.fillStyle = paddle.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = paddle.color;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fill();

            // Laser Cannons indicator
            if (paddle.hasLaser) {
                ctx.fillStyle = '#ffe600';
                ctx.fillRect(paddle.x + 5, paddle.y - 6, 8, 6);
                ctx.fillRect(paddle.x + paddle.width - 13, paddle.y - 6, 8, 6);
            }
            ctx.restore();

            // Draw Balls
            balls.forEach(b => {
                ctx.save();
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00f0ff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Powerups
            powerups.forEach(p => {
                ctx.save();
                ctx.fillStyle = p.info.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.info.color;
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.width, p.height, 6);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 12px Orbitron';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.info.label, p.x + p.width / 2, p.y + p.height / 2);
                ctx.restore();
            });

            // Draw Lasers
            lasers.forEach(l => {
                ctx.save();
                ctx.fillStyle = '#ffe600';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffe600';
                ctx.fillRect(l.x - 2, l.y, 4, 12);
                ctx.restore();
            });

            // Draw Particles
            drawParticles();
        }

        function gameLoop() {
            if (gameState === 'PLAYING') {
                // Update Laser Timer
                if (paddle.hasLaser) {
                    paddle.laserTimer--;
                    if (paddle.laserTimer <= 0) {
                        paddle.hasLaser = false;
                    }
                }

                updateBalls();
                updatePowerups();
                updateLasers();
                updateParticles();
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        function startNewGame() {
            score = 0;
            stage = 1;
            lives = 3;
            updateScoreUI();
            updateLivesUI();
            startStage();
        }

        function startStage() {
            document.getElementById('stage-display').textContent = stage;
            initPaddle();
            balls = [createBall(paddle.x + paddle.width / 2, paddle.y - 10, true)];
            powerups = [];
            lasers = [];
            particles = [];
            createBricks();
            
            gameState = 'PLAYING';
            hideOverlay();
        }

        function stageClear() {
            gameState = 'CLEARED';
            playSound('clear');
            showOverlay('screen-cleared');
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('final-score').textContent = score.toString().padStart(5, '0');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_breakout_highscore', highScore);
                document.getElementById('high-score-msg').classList.remove('hidden');
            } else {
                document.getElementById('high-score-msg').classList.add('hidden');
            }

            showOverlay('screen-gameover');
        }

        function updateScoreUI() {
            document.getElementById('score-display').textContent = score.toString().padStart(5, '0');
        }

        function updateLivesUI() {
            const container = document.getElementById('lives-display');
            container.innerHTML = '';
            for (let i = 0; i < lives; i++) {
                container.innerHTML += `<i data-lucide="heart" class="w-5 h-5 fill-current"></i>`;
            }
            lucide.createIcons();
        }

        function showOverlay(screenId) {
            const overlay = document.getElementById('overlay');
            overlay.classList.remove('hidden');
            ['screen-start', 'screen-gameover', 'screen-cleared'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }

        function hideOverlay() {
            document.getElementById('overlay').classList.add('hidden');
        }

        // Input & Controls Handling
        function handleMove(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const mouseX = (clientX - rect.left) * scaleX;
            paddle.x = Math.max(0, Math.min(CANVAS_WIDTH - paddle.width, mouseX - paddle.width / 2));
        }

        function handleAction() {
            initAudio();
            if (gameState === 'PLAYING') {
                // Release stuck balls
                balls.forEach(b => {
                    if (b.isStuck) b.isStuck = false;
                });
                // Fire Laser
                if (paddle.hasLaser) {
                    fireLaser();
                }
            }
        }

        window.addEventListener('mousemove', e => handleMove(e.clientX));
        window.addEventListener('touchmove', e => {
            if (e.touches.length > 0) handleMove(e.touches[0].clientX);
        });

        window.addEventListener('click', handleAction);
        window.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                handleAction();
            } else if (e.code === 'KeyP') {
                togglePause();
            }
        });

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
            }
        }

        // UI Buttons
        document.getElementById('btn-start').addEventListener('click', () => {
            initAudio();
            startNewGame();
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            initAudio();
            startNewGame();
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            initAudio();
            stage++;
            startStage();
        });

        document.getElementById('btn-pause').addEventListener('click', togglePause);

        document.getElementById('btn-sound').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const text = document.getElementById('sound-text');
            if (soundEnabled) {
                icon.setAttribute('data-lucide', 'volume-2');
                text.textContent = 'SOUND ON';
            } else {
                icon.setAttribute('data-lucide', 'volume-x');
                text.textContent = 'SOUND OFF';
            }
            lucide.createIcons();
        });

        // Initialize App
        window.onload = () => {
            lucide.createIcons();
            updateLivesUI();
            initPaddle();
            draw();
            gameLoop();
        };
    </script>
</body>
</html>
